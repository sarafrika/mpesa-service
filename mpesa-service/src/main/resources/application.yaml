spring:
  application:
    name: 'Mpesa'

  # Datasource configuration (env-driven). The service owns its independent Postgres DB.
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  # JPA / Hibernate: schema is owned by Flyway, so Hibernate only validates it.
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  # One scheduler thread per scheduled job (STK status, webhooks, approvals, balance queries, inbox
  # retention, with room for one more), so a slow job never stalls another.
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:6}

  # Flyway runs on boot; migrations live under db/migrations (non-default location).
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migrations

  # OAuth2 resource server: validate Keycloak-issued JWTs. Left empty for local/test
  # (no security auto-config triggered) and supplied via env in production.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
          # Tokens must name this service in "aud" (Keycloak audience mapper on the caller's client),
          # so an ordinary realm login cannot call the gateway. Blank accepts any realm token.
          audiences: ${KEYCLOAK_AUDIENCE:}

# M-Pesa Daraja API Callback Configuration
mpesa:
  security:
    # Only when the Keycloak issuer URL is not reachable from this service (docker-compose); tokens must
    # still carry the issuer. Blank fetches keys from <issuer>/protocol/openid-connect/certs.
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    # Base64 of 32 random bytes (`openssl rand -base64 32`); encrypts shortcode secrets with AES-256-GCM.
    # Required: the service refuses to start without it. Never reuse the development key in production.
    encryption-key: ${MPESA_ENCRYPTION_KEY:}

  # Safaricom's public certificates (PEM text or a file path) used to encrypt a shortcode's B2C
  # initiator password into its SecurityCredential. Not needed for a shortcode whose
  # security_credential was generated on the Daraja portal.
  certificates:
    sandbox: ${MPESA_SANDBOX_CERTIFICATE:}
    production: ${MPESA_PRODUCTION_CERTIFICATE:}

  # Products (Keycloak clients) may use only the shortcodes and operations granted in the console.
  # Console users still read without grants. false switches every grant check off.
  grants:
    enforce: ${MPESA_GRANTS_ENFORCE:true}

  # Overview attention list: production float (KES) below low-float shows LOW_FLOAT; a shortcode
  # with no traffic for stale-after shows STALE.
  alerts:
    low-float: ${MPESA_ALERTS_LOW_FLOAT:50000}
    stale-after: ${MPESA_ALERTS_STALE_AFTER:6h}

  # Callback inbox: bodies over max-body-bytes are not stored (and cannot be replayed); an entry still
  # RECEIVED after stuck-after may be replayed; more failures than the threshold in an hour is critical.
  callbacks:
    inbox:
      max-body-bytes: ${MPESA_CALLBACK_INBOX_MAX_BODY_BYTES:65536}
      stuck-after: ${MPESA_CALLBACK_INBOX_STUCK_AFTER:5m}
      failure-alert-threshold: ${MPESA_CALLBACK_FAILURE_ALERT_THRESHOLD:0}
      # Entries received longer ago are deleted every retention-interval; a setting of this service, 0 keeps all.
      retention: ${MPESA_CALLBACK_INBOX_RETENTION:90d}
      retention-interval: ${MPESA_CALLBACK_INBOX_RETENTION_INTERVAL:1h}
  # Scheduled Account Balance query for every active shortcode with an initiator. These are settings of this
  # service, not Safaricom's: blank or 0 keeps it off; e.g. 30m. Each instance polls every balance-query-poll
  # and claims due shortcodes, so a shortcode is asked once per interval however many instances run.
  treasury:
    balance-query-interval: ${MPESA_TREASURY_BALANCE_QUERY_INTERVAL:}
    balance-query-poll: ${MPESA_TREASURY_BALANCE_QUERY_POLL:1m}
    balance-query-batch: 20
  # Maker-checker. These are this service's own settings, not Safaricom or Sarafrika policy: how long a
  # request waits for a checker, how long a silent run is trusted before it is resumed, and CSV limits.
  approvals:
    expire-after: ${MPESA_APPROVALS_EXPIRE_AFTER:48h}
    execution-lease: ${MPESA_APPROVALS_EXECUTION_LEASE:15m}
    console-client-id: mpesa-console
    bulk-max-file-size: ${MPESA_APPROVALS_BULK_MAX_FILE_SIZE:512KB}
    bulk-max-rows: ${MPESA_APPROVALS_BULK_MAX_ROWS:1000}

  # Daraja base URLs and HTTP timeouts.
  daraja:
    sandbox:
      base-url: ${MPESA_DARAJA_SANDBOX_BASE_URL:https://sandbox.safaricom.co.ke}
    production:
      base-url: ${MPESA_DARAJA_PRODUCTION_BASE_URL:https://api.safaricom.co.ke}
    connect-timeout: ${MPESA_DARAJA_CONNECT_TIMEOUT:30s}
    read-timeout: ${MPESA_DARAJA_READ_TIMEOUT:60s}

  # Webhook and C2B account lookup URLs must be https to a public address. true also allows
  # http://localhost for local development; never in production.
  outbound:
    allow-localhost: ${MPESA_OUTBOUND_ALLOW_LOCALHOST:false}

  # Signed payment events to products. Retries at 10 s, 1 min, 10 min and 1 h, then FAILED. Each delivery is
  # claimed just before it is sent; the lease must outlast one attempt (connect + request timeout).
  webhooks:
    connect-timeout: ${MPESA_WEBHOOKS_CONNECT_TIMEOUT:3s}
    request-timeout: ${MPESA_WEBHOOKS_REQUEST_TIMEOUT:5s}
    dispatcher:
      enabled: ${MPESA_WEBHOOKS_DISPATCHER_ENABLED:true}
      poll-interval: ${MPESA_WEBHOOKS_POLL_INTERVAL:5s}
      batch-size: 20
      lease: 2m

  callback:
    # Safaricom's known IP addresses for callback requests
    # These are the ONLY IPs that should be allowed to send callbacks
    allowed-ips:
      - "196.201.214.200"
      - "196.201.214.206"
      - "196.201.213.114"
      - "196.201.214.207"
      - "196.201.214.208"
      - "196.201.213.44"
      - "196.201.212.127"
      - "196.201.212.138"
      - "196.201.212.129"
      - "196.201.212.136"
      - "196.201.212.74"
      - "196.201.212.69"

    # Proxies (IPs or CIDRs, comma-separated) in front of this service. Only when the direct peer is one of
    # them is X-Forwarded-For used, taking its right-most entry that is not a trusted proxy.
    trusted-proxies: ${CALLBACK_TRUSTED_PROXIES:}

    # IP whitelisting configuration
    ip-whitelist:
      enabled: ${CALLBACK_IP_WHITELIST_ENABLED:true}  # Set to false for development

    # Base URL for all callback endpoints (update with your actual domain)
    base-url: ${CALLBACK_BASE_URL:https://yourdomain.com/api/v1/callbacks}

    # STK Push callback configuration
    stk:
      url: ${mpesa.callback.base-url}/stk/callback

    # C2B callback configuration
    c2b:
      validation-url: ${mpesa.callback.base-url}/c2b/validation
      confirmation-url: ${mpesa.callback.base-url}/c2b/confirmation

    # B2C callback configuration
    b2c:
      result-url: ${mpesa.callback.base-url}/b2c/result
      timeout-url: ${mpesa.callback.base-url}/b2c/timeout

    # B2B callback configuration
    b2b:
      result-url: ${mpesa.callback.base-url}/b2b/result
      timeout-url: ${mpesa.callback.base-url}/b2b/timeout

    # Transaction Status callback configuration
    transaction-status:
      result-url: ${mpesa.callback.base-url}/transaction-status/result

    # Account Balance callback configuration
    account-balance:
      result-url: ${mpesa.callback.base-url}/account-balance/result
      timeout-url: ${mpesa.callback.base-url}/account-balance/timeout

    # Transaction Reversal callback configuration
    reversal:
      result-url: ${mpesa.callback.base-url}/reversal/result
      timeout-url: ${mpesa.callback.base-url}/reversal/timeout

    # Testing configuration (NEVER enable in production)
    testing:
      enabled: ${CALLBACK_TESTING_ENABLED:false}

  # STK requests still PENDING after status-query-after get an STK push query and are settled. Unanswered
  # ones are asked again after 1, 2, 4... minutes (at most status-query-max-delay) until give-up-after;
  # these are retry settings of this service, not Safaricom limits.
  stk:
    status-query-enabled: ${MPESA_STK_STATUS_QUERY_ENABLED:true}
    status-query-after: ${MPESA_STK_STATUS_QUERY_AFTER:10m}
    status-query-interval-ms: ${MPESA_STK_STATUS_QUERY_INTERVAL_MS:60000}
    status-query-batch: 50
    status-query-max-delay: ${MPESA_STK_STATUS_QUERY_MAX_DELAY:1h}
    status-query-give-up-after: ${MPESA_STK_STATUS_QUERY_GIVE_UP_AFTER:2d}

# Request logging configuration
logging:
  level:
    com.sarafrika.apps.mpesaservice.controllers: INFO

# SSL configuration (callbacks must be HTTPS in production)
server:
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH:}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: ${SSL_KEYSTORE_TYPE:PKCS12}

# Only the health probe is exposed, without details; the container health check calls it.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
