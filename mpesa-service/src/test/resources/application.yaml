# Test configuration: self-contained in-memory datasource so the Spring context
# can start without a real PostgreSQL instance. Flyway (whose migrations are
# PostgreSQL-specific) is disabled in favour of Hibernate schema generation.
spring:
  datasource:
    url: jdbc:h2:mem:mpesa-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false

mpesa:
  security:
    # Fixed development key, never used outside tests and local runs.
    encryption-key: ZGV2LW9ubHktbXBlc2EtZW5jcnlwdGlvbi1rZXktMzI=
  stk:
    status-query-enabled: false
  webhooks:
    # Tests drive the dispatcher directly; its claim query is Postgres-only.
    dispatcher:
      enabled: false
  callback:
    ip-whitelist:
      enabled: false
