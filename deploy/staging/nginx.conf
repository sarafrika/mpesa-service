# Host reverse proxy for malipo.staging.sarafrika.com. Safaricom callbacks and product calls go straight
# to mpesa-service; everything else is the console. TLS: certbot --nginx -d malipo.staging.sarafrika.com
server {
    listen 80;
    server_name malipo.staging.sarafrika.com;

    client_max_body_size 8m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replaces any client-sent value, so the Safaricom IP allow-list sees the real caller.
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/v1/callbacks/ {
        proxy_pass http://127.0.0.1:30100;
    }

    location /api/v1/mpesa/ {
        proxy_pass http://127.0.0.1:30100;
    }

    location / {
        proxy_pass http://127.0.0.1:30101;
    }
}
