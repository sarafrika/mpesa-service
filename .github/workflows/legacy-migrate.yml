name: Migrate legacy paybills

# One-off: copies the original setup's paybill (daraja.merchant_config) and its C2B payments into the M-Pesa
# service's database on the VPS. Secrets move container to container and are never printed; reruns skip what exists.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment for paybills whose keys Safaricom no longer accepts'
        required: false
        default: stop
        type: choice
        options: [stop, PRODUCTION, SANDBOX]

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Migrate over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          LEGACY_ENVIRONMENT: ${{ github.event.inputs.environment }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          command_timeout: 10m
          envs: LEGACY_ENVIRONMENT
          script: |
            set -euo pipefail
            umask 077
            work=$(mktemp -d)
            trap 'rm -rf "$work"; docker exec mpesa-postgres rm -f /tmp/legacy-merchant.csv /tmp/legacy-env.csv /tmp/legacy-payments.csv >/dev/null 2>&1 || true' EXIT
            old() { docker exec -i elimika-postgres sh -c 'psql -U "${POSTGRES_USER:-postgres}" -d daraja -v ON_ERROR_STOP=1 -tA "$@"' sh "$@"; }

            echo "📤 Reading the legacy paybills..."
            # Mpesa-Gateway stored the key, secret, passkey and URLs base64-encoded (PaybillConfigService), not encrypted.
            old -c "copy (select merchant_number::text, organisation_name, convert_from(decode(consumer_key, 'base64'), 'UTF8'), convert_from(decode(consumer_secret, 'base64'), 'UTF8'), convert_from(decode(pass_key, 'base64'), 'UTF8'), created_at from merchant_config order by id) to stdout with (format csv)" > "$work/merchant.csv"
            echo "  $(wc -l < "$work/merchant.csv") paybill(s): $(old -c "select string_agg(merchant_number::text || ' ' || organisation_name || ' (old registration ' || registration_status || ')', '; ') from merchant_config")"

            echo "🔎 After base64 decoding (lengths and URL hosts only):"
            old -c "select merchant_number || ': key ' || length(convert_from(decode(consumer_key, 'base64'), 'UTF8')) || ', secret ' || length(convert_from(decode(consumer_secret, 'base64'), 'UTF8')) || ', passkey ' || length(convert_from(decode(pass_key, 'base64'), 'UTF8')) || case when convert_from(decode(pass_key, 'base64'), 'UTF8') ~ '^[a-f0-9]{64}$' then ' (hex)' else '' end || '; confirmation host ' || substring(convert_from(decode(confirmation_url, 'base64'), 'UTF8') from '^https?://[^/]+') || ', STK host ' || substring(convert_from(decode(stk_callback_url, 'base64'), 'UTF8') from '^https?://[^/]+') from merchant_config" | sed 's/^/  /'

            echo "🔑 Asking Safaricom which environment accepts each paybill's keys (status codes only)..."
            : > "$work/env.csv"
            for num in $(old -c "select merchant_number from merchant_config order by id"); do
              key=$(old -c "select convert_from(decode(consumer_key, 'base64'), 'UTF8') from merchant_config where merchant_number = $num")
              secret=$(old -c "select convert_from(decode(consumer_secret, 'base64'), 'UTF8') from merchant_config where merchant_number = $num")
              token() { printf 'user = "%s:%s"\n' "$key" "$secret" | curl -s -o /dev/null -w '%{http_code}' --max-time 20 -K - "$1/oauth/v1/generate?grant_type=client_credentials" || echo 000; }
              prod=$(token https://api.safaricom.co.ke)
              sand=$(token https://sandbox.safaricom.co.ke)
              unset key secret
              if [ "$prod" = "200" ]; then env=PRODUCTION; elif [ "$sand" = "200" ]; then env=SANDBOX; else env=UNKNOWN; fi
              echo "  $num: production $prod, sandbox $sand -> $env"
              echo "$num,$env" >> "$work/env.csv"
            done

            if grep -q ',UNKNOWN$' "$work/env.csv" && [ "${LEGACY_ENVIRONMENT:-stop}" = "stop" ]; then
              echo "⏸️  Safaricom accepted none of the stored keys, so nothing was loaded."
              exit 0
            fi
            sed -i "s/,UNKNOWN$/,${LEGACY_ENVIRONMENT:-UNKNOWN}/" "$work/env.csv"

            echo "📤 Reading the legacy C2B payments..."
            old -c "copy (select confirmation_payload::text, created_at from mpesa_payment where confirmation_payload is not null order by id) to stdout with (format csv)" > "$work/payments.csv"
            echo "  $(old -c "select count(*) from mpesa_payment") payment(s), $(wc -l < "$work/payments.csv") with a C2B confirmation"
            echo "  payload fields: $(old -c "select string_agg(distinct k, ', ') from mpesa_payment, jsonb_object_keys(confirmation_payload) k where jsonb_typeof(confirmation_payload) = 'object'")"

            docker cp "$work/merchant.csv" mpesa-postgres:/tmp/legacy-merchant.csv
            docker cp "$work/env.csv" mpesa-postgres:/tmp/legacy-env.csv
            docker cp "$work/payments.csv" mpesa-postgres:/tmp/legacy-payments.csv
            docker exec -u root mpesa-postgres chown postgres /tmp/legacy-merchant.csv /tmp/legacy-env.csv /tmp/legacy-payments.csv

            echo "📥 Loading into the M-Pesa service's database..."
            docker exec -i mpesa-postgres psql -U mpesa -d mpesa -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
            BEGIN;
            CREATE TEMP TABLE legacy_merchant (shortcode text, name text, ckey text, csecret text, passkey text, created_at timestamp);
            COPY legacy_merchant FROM '/tmp/legacy-merchant.csv' WITH (FORMAT csv);
            CREATE TEMP TABLE legacy_env (shortcode text, environment text);
            COPY legacy_env FROM '/tmp/legacy-env.csv' WITH (FORMAT csv);
            CREATE TEMP TABLE legacy_payment (payload jsonb, created_at timestamp);
            COPY legacy_payment FROM '/tmp/legacy-payments.csv' WITH (FORMAT csv);

            -- Drafts: they go live through the console's Verify step like any new paybill.
            INSERT INTO mpesa_shortcodes (shortcode, shortcode_type, business_name, consumer_key, consumer_secret, passkey,
                                          callback_url, environment, is_active, operations, credentials_updated_at,
                                          created_at, updated_at, created_by, updated_by)
            SELECT m.shortcode, 'PAYBILL', m.name, m.ckey, m.csecret, NULLIF(m.passkey, ''),
                   'https://malipo.sarafrika.com/api/v1/callbacks/stk/callback', e.environment, false,
                   CASE WHEN COALESCE(m.passkey, '') <> '' THEN 'C2B,STK_PUSH' ELSE 'C2B' END, now(),
                   m.created_at, now(), 'migration:daraja', 'migration:daraja'
            FROM legacy_merchant m JOIN legacy_env e USING (shortcode)
            WHERE e.environment IN ('PRODUCTION', 'SANDBOX')
              AND NOT EXISTS (SELECT 1 FROM mpesa_shortcodes s WHERE s.shortcode = m.shortcode)
            RETURNING shortcode, business_name, environment, operations, 'DRAFT' AS status;

            -- Stored the way C2BConfirmationService stores a live confirmation.
            WITH inserted AS (
              INSERT INTO mpesa_incoming_payments (shortcode_uuid, payment_type, transaction_id, phone_number, amount,
                                                   account_reference, first_name, middle_name, last_name, transaction_date,
                                                   status, raw_callback_data, business_short_code, c2b_channel,
                                                   invoice_number, org_account_balance, processed_at, created_at,
                                                   updated_at, created_by, updated_by)
              SELECT s.uuid, 'C2B', p.payload->>'TransID', p.payload->>'MSISDN', (p.payload->>'TransAmount')::numeric,
                     NULLIF(p.payload->>'BillRefNumber', ''), NULLIF(p.payload->>'FirstName', ''),
                     NULLIF(p.payload->>'MiddleName', ''), NULLIF(p.payload->>'LastName', ''),
                     to_timestamp(p.payload->>'TransTime', 'YYYYMMDDHH24MISS')::timestamp, 'SUCCESS', p.payload,
                     p.payload->>'BusinessShortCode', 'PAYBILL', NULLIF(p.payload->>'InvoiceNumber', ''),
                     NULLIF(p.payload->>'OrgAccountBalance', '')::numeric, p.created_at, p.created_at, now(),
                     'migration:daraja', 'migration:daraja'
              FROM legacy_payment p
              LEFT JOIN mpesa_shortcodes s ON s.shortcode = p.payload->>'BusinessShortCode'
              WHERE COALESCE(p.payload->>'TransID', '') <> ''
                AND COALESCE(p.payload->>'TransAmount', '') ~ '^[0-9]+(\.[0-9]+)?$'
                AND (p.payload->>'TransAmount')::numeric > 0
              ON CONFLICT (transaction_id) DO NOTHING
              RETURNING 1)
            SELECT (SELECT count(*) FROM inserted) AS payments_added, (SELECT count(*) FROM legacy_payment) AS payments_read;
            COMMIT;
            SQL

            echo "🔒 Restarting mpesa-service so it encrypts the copied secrets..."
            docker restart mpesa-service >/dev/null
            STATUS=none
            for i in $(seq 1 36); do
              STATUS=$(docker inspect mpesa-service -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')
              [ "$STATUS" = "healthy" ] && break
              sleep 5
            done
            echo "  mpesa-service: $STATUS"
            docker logs mpesa-service --since 5m 2>&1 | grep -iE 'legacy|re-?encrypt|sealed' | tail -5 || true
            plain=$(docker exec mpesa-postgres psql -U mpesa -d mpesa -tA -c "select count(*) from mpesa_shortcodes where consumer_key not like 'enc:v1:%' or consumer_secret not like 'enc:v1:%' or (passkey is not null and passkey not like 'enc:v1:%')")
            echo "  paybills with a secret still in plaintext: $plain"
            [ "$plain" = "0" ] || { echo "❌ Some secrets are not encrypted yet"; exit 1; }
            echo "✅ Done"
