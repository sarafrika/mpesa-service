name: Find legacy paybills

# One-off and read-only: finds the original service's mpesa_shortcodes rows on the VPS. Prints numbers,
# types and callback hosts, and only whether each secret exists, never a secret value.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look for legacy paybills over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          script: |
            set -uo pipefail
            echo "🔎 Column names and types only (no values) in elimika-postgres/daraja:"
            docker exec elimika-postgres sh -c 'psql -U ${POSTGRES_USER:-postgres} -d daraja -P pager=off -c "select table_name, column_name, data_type, is_nullable from information_schema.columns where table_schema = '"'"'public'"'"' and table_name in ('"'"'merchant_config'"'"', '"'"'mpesa_payment'"'"') order by table_name, ordinal_position"'
            echo ""
            echo "🔎 Containers with mpesa in their name or image:"
            docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' | grep -i mpesa || echo "  none"
            echo ""
            for c in $(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($2) ~ /postgres/ {print $1}'); do
              user=$(docker exec "$c" sh -c 'echo ${POSTGRES_USER:-postgres}')
              for db in $(docker exec "$c" psql -U "$user" -d postgres -tAc "select datname from pg_database where not datistemplate" 2>/dev/null); do
                found=$(docker exec "$c" psql -U "$user" -d "$db" -tAc "select to_regclass('public.mpesa_shortcodes') is not null" 2>/dev/null)
                [ "$found" = "t" ] || continue
                echo "📦 container=$c database=$db"
                docker exec "$c" psql -U "$user" -d "$db" -P pager=off -c "
                  select shortcode, shortcode_type as type, environment as env, is_active as active, business_name,
                         coalesce(consumer_key, '') <> '' as has_key, coalesce(consumer_secret, '') <> '' as has_secret,
                         coalesce(passkey, '') <> '' as has_passkey,
                         substring(callback_url from '^https?://[^/]+') as callback_host,
                         substring(confirmation_url from '^https?://[^/]+') as confirmation_host,
                         deleted_at is not null as deleted, created_at::date as created
                  from mpesa_shortcodes order by created_at" 2>&1
                echo ""
              done
            done
