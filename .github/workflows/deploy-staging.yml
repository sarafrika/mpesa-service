name: Deploy to staging

on:
  # After either image is published from main
  workflow_run:
    workflows: ["mpesa-service", "mpesa-ui"]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deployment_reason:
        description: 'Reason for manual deployment (optional)'
        required: false
        default: 'Manual deployment'
        type: string

# Deploys recreate the same containers, so they run one at a time instead of racing on their names.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to the staging VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR runs of the build workflows publish nothing, so only a successful push or manual run deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')

    steps:
      - name: Run the deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_REASON: ${{ github.event.inputs.deployment_reason }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          envs: EVENT_NAME,DEPLOYMENT_REASON,WORKFLOW_RUN_NAME
          script: |
            set -euo pipefail
            mkdir -p /opt/sarafrika/mpesa
            cd /opt/sarafrika/mpesa

            if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
              echo "🚀 Manual deployment: $DEPLOYMENT_REASON"
            else
              echo "🔄 Automatic deployment after $WORKFLOW_RUN_NAME published"
            fi

            # This deploy never checks out the repo, so the stack is written here on every run.
            cat > compose.yaml <<'YAML'
            # managed-by: mpesa-deploy. Generated by .github/workflows/deploy-staging.yml; hand edits are overwritten.
            # Served at https://malipo.staging.sarafrika.com. Secrets and the Keycloak issuer come from .env.
            name: mpesa

            networks:
              # Shared with Keycloak and Elimika, which calls the service as http://mpesa-service:8080.
              sarafrika:
                external: true
                name: ${SARAFRIKA_NETWORK:?missing from .env}
              # Postgres is reachable from the service only.
              mpesa:

            volumes:
              mpesa_postgres:

            services:
              mpesa-postgres:
                image: postgres:17-alpine
                container_name: mpesa-postgres
                restart: unless-stopped
                mem_limit: 512m
                environment:
                  POSTGRES_DB: mpesa
                  POSTGRES_USER: mpesa
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing from .env}
                volumes:
                  - mpesa_postgres:/var/lib/postgresql/data
                networks: [mpesa]
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U mpesa -d mpesa"]
                  interval: 10s
                  retries: 10

              mpesa-service:
                image: sarafrika/mpesa-service:latest
                container_name: mpesa-service
                restart: unless-stopped
                # The JVM takes 75% of this limit (JAVA_OPTS in the Dockerfile).
                mem_limit: 1024m
                mem_reservation: 512m
                depends_on:
                  mpesa-postgres: { condition: service_healthy }
                environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://mpesa-postgres:5432/mpesa
                  SPRING_DATASOURCE_USERNAME: mpesa
                  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
                  KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER:?missing from .env}
                  KEYCLOAK_AUDIENCE: mpesa-service
                  MPESA_ENCRYPTION_KEY: ${MPESA_ENCRYPTION_KEY:?missing from .env}
                  CALLBACK_BASE_URL: https://malipo.staging.sarafrika.com/api/v1/callbacks
                  # Callbacks arrive through the host's reverse proxy on the Docker bridge.
                  CALLBACK_TRUSTED_PROXIES: 172.16.0.0/12
                  CALLBACK_IP_WHITELIST_ENABLED: ${CALLBACK_IP_WHITELIST_ENABLED:-true}
                  MPESA_TREASURY_BALANCE_QUERY_INTERVAL: ${MPESA_TREASURY_BALANCE_QUERY_INTERVAL:-}
                  MPESA_SANDBOX_CERTIFICATE: ${MPESA_SANDBOX_CERTIFICATE:-}
                ports:
                  - "127.0.0.1:30100:8080"
                networks: [mpesa, sarafrika]

              mpesa-ui:
                image: sarafrika/mpesa-ui:latest
                container_name: mpesa-ui
                restart: unless-stopped
                mem_limit: 512m
                depends_on: [mpesa-service]
                environment:
                  NEXTAUTH_URL: https://malipo.staging.sarafrika.com
                  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?missing from .env}
                  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
                  KEYCLOAK_CLIENT_ID: mpesa-ui
                  MPESA_SERVICE_URL: http://mpesa-service:8080
                ports:
                  - "127.0.0.1:30101:3000"
                networks: [sarafrika]
            YAML

            # .env is written once: regenerating MPESA_ENCRYPTION_KEY would make every stored credential
            # unreadable, and a new POSTGRES_PASSWORD would not match the existing database.
            if [ ! -f .env ]; then
              echo "🔑 First deployment: generating .env"
              echo "🔎 Finding the Keycloak on this server..."
              KC_ID=$(docker ps --format '{{.ID}} {{.Image}}' | awk 'tolower($2) ~ /keycloak/ {print $1; exit}')
              if [ -z "$KC_ID" ]; then
                echo "❌ No running Keycloak container found. Add KEYCLOAK_ISSUER=<base>/realms/sarafrika to .env by hand."
                exit 1
              fi
              KC_HOST=$(docker inspect "$KC_ID" -f '{{range .Config.Env}}{{println .}}{{end}}' \
                | sed -n -E 's/^KC_HOSTNAME(_URL)?=(.+)$/\2/p' | head -1)
              if [ -z "$KC_HOST" ]; then
                KC_HOST=$(docker inspect "$KC_ID" -f '{{join .Args " "}}' | grep -oE -- '--hostname(-url)?[= ][^ ]+' | head -1 | sed -E 's/--hostname(-url)?[= ]//')
              fi
              if [ -z "$KC_HOST" ]; then
                echo "❌ Keycloak $(docker inspect "$KC_ID" -f '{{.Name}}') has no KC_HOSTNAME. Add KEYCLOAK_ISSUER=<base>/realms/sarafrika to .env by hand."
                exit 1
              fi
              case "$KC_HOST" in http*) ;; *) KC_HOST="https://$KC_HOST" ;; esac
              KC_HOST="${KC_HOST%/}"
              ISSUER=$(curl -fsS "$KC_HOST/realms/sarafrika/.well-known/openid-configuration" \
                | grep -oE '"issuer":"[^"]+"' | cut -d'"' -f4) || true
              if [ -z "$ISSUER" ]; then
                echo "❌ $KC_HOST has no sarafrika realm yet. Create it, then run this deployment again."
                exit 1
              fi
              (umask 077 && {
                echo "KEYCLOAK_ISSUER=$ISSUER"
                echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
                echo "MPESA_ENCRYPTION_KEY=$(openssl rand -base64 32)"
                echo "NEXTAUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
              } > .env)
              echo "  issuer: $ISSUER"
            fi

            # The Docker network Elimika and Keycloak share, so Elimika reaches the service by name.
            if ! grep -q '^SARAFRIKA_NETWORK=' .env; then
              networks_of() { docker inspect "$1" -f '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' 2>/dev/null | grep -v '^$' | sort || true; }
              KC_NAME=$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($2) ~ /keycloak/ {print $1; exit}')
              NET=$(comm -12 <(networks_of elimika) <(networks_of "$KC_NAME") | head -1)
              if [ -z "$NET" ]; then NET=$(networks_of elimika | head -1); fi
              if [ -z "$NET" ]; then
                echo "❌ Couldn't find Elimika's Docker network. Add SARAFRIKA_NETWORK=<network> to .env by hand."
                exit 1
              fi
              echo "SARAFRIKA_NETWORK=$NET" >> .env
              echo "🔗 Joining Docker network $NET"
            fi

            for name in mpesa-postgres mpesa-service mpesa-ui; do
              project=$(docker inspect "$name" -f '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null || true)
              if [ -n "$project" ] && [ "$project" != "mpesa" ]; then
                echo "❌ A container named $name already runs from compose project '$project'. Remove it first."
                exit 1
              fi
            done

            # Names only (entrypoints, resolvers, providers, router rules), never values that could be secrets.
            echo "🔎 Traefik on this server:"
            TRAEFIK=$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($2) ~ /traefik/ {print $1; exit}')
            if [ -n "$TRAEFIK" ]; then
              echo "  container: $TRAEFIK"
              docker inspect "$TRAEFIK" -f '{{join .Args "\n"}}{{println}}{{join .Config.Cmd "\n"}}' 2>/dev/null \
                | grep -oE -- '--(entrypoints\.[A-Za-z0-9_-]+\.address=[^ ]*|certificatesresolvers\.[A-Za-z0-9_-]+|providers\.[A-Za-z.]+(=(true|false|[A-Za-z0-9_./-]+))?|configfile=[^ ]*)' | sort -u | sed 's/^/  arg /' || true
              docker inspect "$TRAEFIK" -f '{{range $k, $v := .NetworkSettings.Networks}}  network {{$k}}{{println}}{{end}}'
              for name in elimika elimika-ui; do
                docker inspect "$name" -f '{{range $k, $v := .Config.Labels}}{{println $k "=" $v}}{{end}}' 2>/dev/null \
                  | grep -E '^traefik\.(enable|docker\.network|http\.routers\.[^.]+\.(rule|entrypoints|tls|tls\.certresolver|middlewares)|http\.services\.[^.]+\.loadbalancer\.server\.port) ' \
                  | sed "s/^/  $name label /" || true
              done
            else
              echo "  no running Traefik container"
            fi

            echo "📥 Pulling images..."
            docker compose pull

            echo "🚀 Recreating containers..."
            docker compose up -d --remove-orphans

            echo "🔍 Verifying the running containers use the images just pulled..."
            for name in mpesa-service mpesa-ui; do
              LATEST_ID=$(docker image inspect "sarafrika/$name:latest" -f '{{.Id}}')
              RUNNING_ID=$(docker inspect "$name" -f '{{.Image}}')
              if [ "$LATEST_ID" != "$RUNNING_ID" ]; then
                echo "❌ $name is not running sarafrika/$name:latest"; exit 1
              fi
            done

            echo "🩺 Waiting for mpesa-service to report healthy..."
            STATUS=none
            for i in $(seq 1 36); do
              STATUS=$(docker inspect mpesa-service -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')
              if [ "$STATUS" = "healthy" ]; then break; fi
              if [ "$STATUS" = "unhealthy" ]; then break; fi
              sleep 5
            done
            if [ "$STATUS" != "healthy" ]; then
              echo "❌ mpesa-service is $STATUS"; docker logs mpesa-service --tail 80; exit 1
            fi

            echo "🩺 Checking the console answers..."
            for i in $(seq 1 12); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:30101/sign-in || true)
              if [ "$CODE" = "200" ]; then break; fi
              sleep 5
            done
            if [ "$CODE" != "200" ]; then
              echo "❌ mpesa-ui returned $CODE"; docker logs mpesa-ui --tail 60; exit 1
            fi

            docker image prune -f || true
            echo ""
            echo "✅ Deployed. Service on 127.0.0.1:30100, console on 127.0.0.1:30101."
            echo "🌍 https://malipo.staging.sarafrika.com once nginx routes the host to these ports"
