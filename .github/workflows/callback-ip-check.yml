name: Callback IP check

# One-off and read-only: shows which caller IPs mpesa-service recorded for recent callback requests.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the callback IP log lines over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          script: |
            docker logs mpesa-service --since 30m 2>&1 | grep -E "(Rejected|Accepted) callback request from" | tail -10
