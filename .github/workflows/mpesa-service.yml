name: mpesa-service

on:
  # Tests and the API contract check run on every PR that touches the service
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]
    paths:
      - 'mpesa-service/**'
      - 'mpesa-ui/openapi.json'
      - '.github/workflows/mpesa-service.yml'

  # Allow manual trigger
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mpesa-service
  JAVA_VERSION: '21'

defaults:
  run:
    working-directory: mpesa-service

jobs:
  test:
    name: Test and check the API contract
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      # mpesa-ui generates its client from mpesa-ui/openapi.json; a changed API must ship a refreshed spec.
      - name: Check the UI's copy of the OpenAPI spec is current
        run: |
          ./gradlew exportOpenApi --no-daemon
          git diff --exit-code -- ../mpesa-ui/openapi.json || {
            echo "::error::mpesa-ui/openapi.json is stale. Run ./gradlew exportOpenApi in mpesa-service and commit it."
            exit 1
          }

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "Error: DOCKERHUB_USERNAME secret is not set"
            exit 1
          fi
          echo "Docker Hub username: ${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: mpesa-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mpesa-service
          cache-to: type=gha,mode=max,scope=mpesa-service
          platforms: linux/amd64,linux/arm64
