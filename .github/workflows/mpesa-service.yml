name: mpesa-service

on:
  # Tests and the API contract check run on every PR that touches the service
  pull_request:
    branches: [ main ]
    paths:
      - 'mpesa-service/**'
      - 'mpesa-ui/openapi.json'
      - '.github/workflows/mpesa-service.yml'

  # Every change to the service on main publishes sarafrika/mpesa-service
  push:
    branches: [ main ]
    paths:
      - 'mpesa-service/**'
      - '.github/workflows/mpesa-service.yml'

  workflow_dispatch:

# A newer run for the same branch replaces the older one, so only one image is pushed per change.
concurrency:
  group: mpesa-service-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: sarafrika/mpesa-service
  JAVA_VERSION: '21'

defaults:
  run:
    working-directory: mpesa-service

jobs:
  test:
    name: Test and check the API contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpesa-service-test-reports
          path: mpesa-service/build/reports/tests/test
          retention-days: 7

      # mpesa-ui generates its client from mpesa-ui/openapi.json; a changed API must ship a refreshed spec.
      - name: Check the UI's copy of the OpenAPI spec is current
        run: |
          ./gradlew exportOpenApi --no-daemon
          git diff --exit-code -- ../mpesa-ui/openapi.json || {
            echo "::error::mpesa-ui/openapi.json is stale. Run ./gradlew exportOpenApi in mpesa-service and commit it."
            exit 1
          }

  publish:
    name: Build and push the Docker image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read the version
        run: |
          version=$(grep -E "^version\s*=" build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mpesa-service
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}

      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Published ${IMAGE_NAME}"
            echo "- \`${IMAGE_NAME}:latest\`"
            echo "- \`${IMAGE_NAME}:${APP_VERSION}\`"
            echo "- \`${IMAGE_NAME}:${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
