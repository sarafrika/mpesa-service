name: mpesa-ui

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, closed ]
    paths:
      - 'mpesa-ui/**'
      - '.github/workflows/mpesa-ui.yml'

  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mpesa-ui

defaults:
  run:
    working-directory: mpesa-ui

jobs:
  check:
    name: Generate client, lint and build
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: mpesa-ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mpesa-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A spec change that breaks a screen fails here, in the same PR.
      - name: Generate the API client with Orval
        run: pnpm api:generate

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: mpesa-ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mpesa-ui
          cache-to: type=gha,mode=max,scope=mpesa-ui
          platforms: linux/amd64,linux/arm64
