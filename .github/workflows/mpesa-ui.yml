name: mpesa-ui

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mpesa-ui/**'
      - '.github/workflows/mpesa-ui.yml'

  # Every change to the console on main publishes sarafrika/mpesa-ui
  push:
    branches: [ main ]
    paths:
      - 'mpesa-ui/**'
      - '.github/workflows/mpesa-ui.yml'

  workflow_dispatch:

concurrency:
  group: mpesa-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: sarafrika/mpesa-ui

defaults:
  run:
    working-directory: mpesa-ui

jobs:
  check:
    name: Generate client, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: mpesa-ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mpesa-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A spec change that breaks a screen fails here, in the same PR.
      - name: Generate the API client with Orval
        run: pnpm api:generate

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    name: Build and push the Docker image
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read the version
        run: |
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Settings are read at runtime, so one image serves every environment.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: mpesa-ui
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}

      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Published ${IMAGE_NAME}"
            echo "- \`${IMAGE_NAME}:latest\`"
            echo "- \`${IMAGE_NAME}:${APP_VERSION}\`"
            echo "- \`${IMAGE_NAME}:${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
